#!name=PingMe Auto CheckIn
#!desc=获取Cookie + 自动化签到 + 视频奖励。支持 UI 交互开关控制。
#!author=Egern Port
#!icon=message.badge.filled

env_schema:
  CAPTURE_ENABLED:
    name: "账号抓取 - 启用"
    description: "关闭后抓包脚本不再处理任何请求"
    options: ["true", "false"]
    default_value: "true"
  TASK_ENABLED:
    name: "签到任务 - 总开关"
    description: "关闭后定时任务不执行任何操作"
    options: ["true", "false"]
    default_value: "true"
  ENABLE_CHECKIN:
    name: "签到任务 - 执行签到"
    description: "是否执行每日签到"
    options: ["true", "false"]
    default_value: "true"
  ENABLE_VIDEO:
    name: "签到任务 - 执行视频奖励"
    description: "是否领取视频奖励金币"
    options: ["true", "false"]
    default_value: "true"
  MAX_VIDEO:
    name: "签到任务 - 最大视频次数"
    description: "每账号每次最多领取视频奖励次数 (1-10)"
    default_value: "5"

mitm:
  hostnames: ["api.pingmeapp.net"]

http_captures:
  - "^https://api\\.pingmeapp\\.net/app/queryBalanceAndBonus"

scriptings:
  - http_request:
      name: "PingMe 账号抓取"
      match: "^https://api\\.pingmeapp\\.net/app/queryBalanceAndBonus"
      timeout: 60
      # 下面是带逻辑判断的 Base64 脚本
      script_base64: ""

  - schedule:
      name: "PingMe 签到任务"
      cron: "30 10,18,22 * * *"
      timeout: 150
      # 下面是带逻辑判断的 Base64 脚本
      script_base64: ""
