name: "组件拆分套装"
description: "纯净度、流媒体、AI独立中组件"

scriptings:
  - generic:
      name: "Split-Widget-Script"
      script_url: "https://raw.githubusercontent.com/sulirourou/Script/main/js/IP-Panel.js"
      timeout: 15

widgets:
  - name: "1. IP纯净度面板"
    script_name: "Split-Widget-Script"
    env:
      TYPE: "IP"
      
  - name: "2. 流媒体解锁"
    script_name: "Split-Widget-Script"
    env:
      TYPE: "STREAM"
      
  - name: "3. AI助手"
    script_name: "Split-Widget-Script"
    env:
      TYPE: "AI"

